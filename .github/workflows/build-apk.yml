name: Build Al Ghadeer Khata Pro Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Android APK & Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Build Android APK
        run: |
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              cp -r "$SUBDIR"/* .
            fi
          fi
          npm install
          npx cap add android
          npx cap sync android
          cp -r resources/mipmap-* android/app/src/main/res/ || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease || true

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ghadeer-Khata-Pro-Android-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ghadeer-Khata-Pro-PlayStore-AAB
          path: "**/app/build/outputs/bundle/release/*.aab"
          if-no-files-found: warn
