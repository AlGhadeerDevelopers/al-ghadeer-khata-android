name: Build Al Ghadeer Khata Pro Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Android APK & Release Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies & Capacitor
        run: |
          npm install

      - name: Add Android Native Platform & Sync Assets
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Copy High-Res App Launcher Icons
        run: |
          cp -r resources/mipmap-* android/app/src/main/res/ || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK & AAB Bundle
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ghadeer-Khata-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release Bundle (Google Play Store AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ghadeer-Khata-Pro-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
